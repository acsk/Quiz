<div class="multi-select relative" appClickOutside (appClickOutside)="closeDropdown()">
  <button
    type="button"
    class="multi-select__trigger"
    [class.is-open]="dropdownOpen"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    [attr.aria-expanded]="dropdownOpen"
    aria-haspopup="listbox"
  >
    <span class="multi-select__value">{{ displayLabel }}</span>
    <span *ngIf="selectedItems.length > 0" class="multi-select__badge">{{ selectedItems.length }}</span>
    <span class="multi-select__chevron" [class.is-open]="dropdownOpen" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 10.94l3.71-3.71a.75.75 0 0 1 1.08 1.04l-4.24 4.24a.75.75 0 0 1-1.08 0L5.21 8.25a.75.75 0 0 1 .02-1.04Z"/></svg>
    </span>
  </button>

  <div *ngIf="dropdownOpen" class="multi-select__panel" role="listbox" aria-multiselectable="true">
    <div class="multi-select__search">
      <svg class="multi-select__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6" />
        <line x1="20" y1="20" x2="16.65" y2="16.65" />
      </svg>
      <input
        #searchInput
        type="text"
        [(ngModel)]="searchText"
        (input)="filterItems()"
        placeholder="Pesquisar tópicos..."
        class="multi-select__search-input"
      />
    </div>

    <ul class="multi-select__list">
      <li class="multi-select__option multi-select__option--all">
        <label class="multi-select__option-label" [class.is-active]="allSelected || isPartialSelection">
          <input
            type="checkbox"
            class="multi-select__checkbox"
            [checked]="allSelected"
            [indeterminate]="isPartialSelection"
            (change)="toggleSelectAll()"
          />
          <span>Selecionar todos</span>
        </label>
      </li>

      <li *ngFor="let item of filteredItems; trackBy: trackByItem" class="multi-select__option">
        <label class="multi-select__option-label" [class.is-active]="isSelected(item)">
          <input
            type="checkbox"
            class="multi-select__checkbox"
            [checked]="isSelected(item)"
            (change)="toggleSelection(item)"
          />
          <ng-container *ngIf="itemTemplate; else defaultTemplate" [ngTemplateOutlet]="itemTemplate" [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
          <ng-template #defaultTemplate>{{ item.name || item }}</ng-template>
        </label>
      </li>

      <li *ngIf="filteredItems.length === 0" class="multi-select__empty">Nenhum tópico encontrado.</li>
    </ul>

    <div class="multi-select__footer">
      <button type="button" class="multi-select__clear" (click)="clearAll()">Limpar seleção</button>
    </div>
  </div>
</div>
